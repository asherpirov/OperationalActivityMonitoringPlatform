  services:
    
    kafka:
      image: apache/kafka:4.3.1
      container_name: kafka2
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: 'broker,controller'
        KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092'
        KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,DOCKER://kafka:29092'
        KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT'
        KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_NUM_PARTITIONS: 1

      healthcheck:
        test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s

    mysql:
      image: mysql:8.4
      container_name: mysql2
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      ports:
        - "3306:3306"
      volumes:
        - mysql_data:/var/lib/mysql
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

    mongo:
      image: mongo:8.3.11
      container_name: mongo2
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db
    

    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      container_name: elasticsearch2
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ports:
        - "9200:9200"
      volumes:
        - es_data:/usr/share/elasticsearch/data
      healthcheck:
        test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
  
    kibana:
      image: docker.elastic.co/kibana/kibana:8.15.0
      container_name: kibana2
      depends_on:
        elasticsearch:
          condition: service_healthy
      ports:
        - "5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    station_loader:
      build: ./services/station-loader
      container_name: station_loader
      depends_on:
        mysql:
          condition: service_healthy
      environment:
          MYSQL_HOST: mysql
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE: ${MYSQL_DATABASE}
      restart: on-failure

    producer:
      build: ./services/producer
      container_name: producer-events
      depends_on:
        kafka:
          condition: service_healthy
      environment:
        - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      restart: on-failure

    raw-consumer:
      build: ./services/raw-consumer
      container_name: raw-consumer
      depends_on:
        kafka: 
          condition: service_healthy
        mongo:
          condition: service_started
      environment:
         Kafka__BootstrapServers: kafka:29092
         Kafka__GroupId: activity-group-events
         Kafka__TopicName: activity-readings
         MongoDbSettings__DatabaseName: "ActivityDb"
         MongoDbSettings__CollectionName: "raw_readings"
         MongoDbSettings__ConnectionString: mongodb://root:secret@mongo:27017/?authSource=admin
    

  volumes:
    es_data:
    mysql_data:
    mongo_data: